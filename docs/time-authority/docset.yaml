schema: aiwg.pagenbar.docset/v1
id: roko-time-authority
title: ROKO Time Authority Deployment
version: 1.0.0
entrypoint: README.md
default_path: choose-sources.md
principles:
  - Establish trustworthy host time before joining ROKO.
  - Use ntp01.roko.network as one source, never the only source.
  - Require at least two selectable sources from different failure domains.
  - Verify observed stratum, offset, root distance, reachability, and leap state.
