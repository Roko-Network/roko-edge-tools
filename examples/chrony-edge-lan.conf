# Example only. Replace LAN subnet/interface/address with your actual network.

server ntp01.roko.network iburst
pool pool.ntp.org iburst maxsources 3
minsources 2
makestep 0.1 3
rtcsync

# Serve only the private LAN.
allow 192.168.1.0/24
bindaddress 192.168.1.10

# Disable remote chronyc UDP command port.
cmdport 0

# Limit abusive or misconfigured clients.
ratelimit interval 3 burst 8 leak 2
