apiVersion: setup.aiwg.io/v1
kind: SetupManifest
metadata:
  name: roko-node-guided
  version: 1.1.0
  description: Guided ROKO full, archive, observer, or validator-candidate bootstrap/testing/edge preparation with Chrony.
  install_type: user

spec:
  platforms:
    - os: linux
      distros: [ubuntu, debian, fedora, rhel, rocky, centos]
      arch: [x86_64, arm64]
      shell: bash

  params:
    - name: NODE_NAME
      type: string
      interactive_required: true
      description: Public node name using letters, digits, dots, underscores, or hyphens.
    - name: NODE_ROLE
      type: choice
      choices: [full, archive, observer, validator-candidate]
      interactive_required: true
      description: Install role. Every role joins ROKO chain P2P and its time protocol; observer additionally advertises authenticated ROKO PTP² measurements. Validator candidates remain non-authoring until their open staking candidacy is selected and verified.
    - name: RUNTIME
      type: choice
      choices: [native, docker]
      interactive_required: true
      description: Verified native binary or immutable container-image runtime.
    - name: CLOCK_PROVIDER
      type: choice
      choices: [chrony]
      default: chrony
      description: Host clock provider for the standard guided profile. Chrony does not join the separate licensed Timebeat PTP² Mesh.
    - name: SYNC_TIMEOUT_SECONDS
      type: int
      default: 3600
      description: Maximum time to wait for full P2P synchronization.
    - name: REPORT_PATH
      type: path
      default: ./roko-install-readiness.txt
      description: Value-free installation receipt.

  prerequisites:
    - name: bash
      detect: command -v bash
      install_hint: Install Bash using the operating-system package manager.
    - name: systemd
      detect: command -v systemctl
      install_hint: Use a supported systemd-based Linux distribution.
    - name: curl
      detect: command -v curl
      install_hint: Install curl using the operating-system package manager.
    - name: python3
      detect: command -v python3
      install_hint: Install Python 3 using the operating-system package manager.

  steps:
    - id: preflight
      type: script
      script: scripts/preflight.sh
      params: [NODE_NAME, NODE_ROLE, RUNTIME]
    - id: install-clock
      type: script
      script: scripts/install-chrony.sh
      depends_on: [preflight]
      params: [CLOCK_PROVIDER]
      verify: chronyc waitsync 1 0.01
    - id: install-node
      type: script
      script: scripts/install-roko-node.sh
      depends_on: [install-clock]
      params: [NODE_NAME, NODE_ROLE, RUNTIME, CLOCK_PROVIDER]
      verify: test -f /etc/systemd/system/roko-node.service
    - id: configure-observer
      type: script
      script: scripts/configure-roko-observer.sh
      depends_on: [install-node]
      params: [NODE_ROLE, RUNTIME]
    - id: start-and-verify
      type: script
      script: scripts/start-and-verify.sh
      depends_on: [install-node, configure-observer]
      params: [SYNC_TIMEOUT_SECONDS]
      verify: systemctl is-active --quiet roko-node.service
      on_fail: restart-services
    - id: readiness-report
      type: script
      script: scripts/write-readiness-report.sh
      depends_on: [start-and-verify]
      params: [NODE_NAME, NODE_ROLE, RUNTIME, CLOCK_PROVIDER, REPORT_PATH]
      verify: test -s "${REPORT_PATH}"
    - id: wallet-safety-briefing
      type: ask
      depends_on: [readiness-report]
      when: NODE_ROLE == "validator-candidate"
      message: Open the beginner validator guide and create or select a dedicated EVM wallet. Keep its seed/private key in the wallet only; an agent or ROKO support will never ask for it. Continue to the public-address and funding checks?
      on_deny: skip
    - id: claim-lock-and-bond
      type: ask
      depends_on: [wallet-safety-briefing]
      when: NODE_ROLE == "validator-candidate"
      message: In your own browser wallet, obtain at least 50 ROKO plus fees, use claim.roko.network if eligible, and use stake.roko.network to lock 50 ROKO. The live runtime does not expose EVM staking precompile 0x0700; continue to the release-matched native bond handoff and require a real staking ledger before treating the account as bonded.
      on_deny: skip
    - id: enrollment-handoff
      type: ask
      depends_on: [claim-lock-and-bond]
      when: NODE_ROLE == "validator-candidate"
      message: A native staking ledger proves bonding; an EVM success receipt to empty address 0x0700 does not. Continue to the documented local-key and signed-enrollment handoff; do not enable unsafe author RPC publicly.
      on_deny: skip
    - id: temporal-peer-handoff
      type: ask
      depends_on: [enrollment-handoff]
      when: NODE_ROLE == "validator-candidate"
      message: Confirm temporal_getConsensusTime reports at least two mapped ROKO authority peers. Ordinary chain sync through the public boot/full node is not sufficient; if peerCount is zero, publish the candidate P2P multiaddress and arrange direct P2P reachability to two active authorities before enabling authoring.
      on_deny: skip

  recovery:
    - id: restart-services
      steps:
        - id: restart-clock-and-node
          type: script
          script: scripts/restart-services.sh
          params: [CLOCK_PROVIDER]

  briefing:
    success: ROKO node installation and full synchronization checks completed.
    next_steps:
      - Review the value-free readiness report.
      - Validator candidates follow the interactive wallet, 50-pwROKO bond, session-key, validate-intent, candidacy, and activation checks in the beginner guide.
